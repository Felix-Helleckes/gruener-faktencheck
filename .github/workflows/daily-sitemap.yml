name: Sitemap & RSS-Feed (wöchentlich)

on:
  schedule:
    # Läuft jeden Sonntag um 00:00 UTC (01:00 MEZ)
    - cron: '0 0 * * 0'
  workflow_dispatch:  # Manuelle Ausführung möglich

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate Sitemap and RSS Feed
        run: |
          echo "📄 Generiere Sitemap und RSS-Feed..."
          python scripts/generate_sitemap.py
          python scripts/generate_rss.py

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          # Alle generierten SEO-Dateien hinzufügen
          git add -A public/

          # Commit nur wenn Änderungen vorhanden sind
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Auto-generated: Sitemap & RSS-Feed (wöchentlich)" && git push)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
