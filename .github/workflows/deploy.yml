name: Build-Check & SEO-Dateien

# Dieser Workflow deployt NICHT.
# Veröffentlicht wird ausschließlich über Netlifys eigene GitHub-Integration:
# Jeder Push auf main löst dort einen Build aus (npm run build -> dist).
# Ob der Build nötig ist, entscheidet netlify.toml / scripts/netlify-ignore.sh.
#
# Hier passiert nur zweierlei:
#   1. Ein Probe-Build, der Fehler im Actions-Tab sichtbar macht.
#   2. Die generierten SEO-Dateien (sitemap.xml, feed.xml) werden ins Repo
#      zurückgeschrieben, damit der Stand dort aktuell bleibt.
#
# Früher stand hier ein Schritt "Deploy to Netlify" (nwtgck/actions-netlify).
# Weil die Secrets NETLIFY_AUTH_TOKEN und NETLIFY_SITE_ID nie gesetzt waren,
# brach er sofort ab ("Netlify credentials not provided, not deployable") und
# meldete trotzdem success. Er wurde entfernt.
# Die Secrets bitte NICHT nachtragen: Dann würde jeder Push zweimal deployen,
# einmal über Netlify und einmal hier – zu je 15 Credits.

on:
  push:
    branches:
      - main
    # Spart überflüssige Workflow-Läufe bei Änderungen, die den Build nicht
    # betreffen. Credits spart das nicht – das regelt netlify.toml.
    # GitHub überspringt einen Push nur, wenn ALLE geänderten Dateien hier
    # passen – ein Commit, der auch src/ anfasst, läuft weiterhin.
    #
    # Bewusst NICHT aufgeführt, weil im Build enthalten:
    #   index.html, GFLogo.png (Favicon), src/**, public/**,
    #   scripts/** (erzeugt sitemap.xml und feed.xml), package*.json
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - '.gitignore'
      - 'docs/**'
      - '.github/**'
      - '.githooks/**'
      - 'deploy.sh'
      - 'deploy.bat'
      - 'setup-hooks.js'
      - 'setup-hooks.sh'
      - 'setup-hooks.bat'
      - 'verify_links.js'
      - 'verify-cloudflare.js'
      - 'merge_articles.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-check:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm ci

      - name: Generate SEO files (Sitemap, RSS, Static HTML)
        run: |
          echo "📄 Generiere Sitemap, RSS und statisches HTML..."
          npm run generate

      - name: Probe-Build
        run: |
          echo "🏗️ Probe-Build (veröffentlicht wird über Netlify)..."
          npm run build

      - name: Commit generated files
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          # Füge alle generierten Dateien hinzu
          git add -A public/

          # Commit nur wenn Änderungen vorhanden sind.
          # "[skip ci]" ist wichtig: Netlify baut jeden Push auf main. Ohne den
          # Marker würde dieser Auto-Commit einen zweiten Production Deploy
          # auslösen (15 Credits), obwohl Netlify die Dateien beim Build ohnehin
          # selbst erzeugt. Netlify und GitHub Actions respektieren den Marker.
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Auto-generated: SEO-Dateien (Sitemap, RSS) [skip ci]" && git push)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
